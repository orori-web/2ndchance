<title>Houses</title>

<body>


<div id="house-site-header"></div>

<hr>

<!-- ==========================================
     HOUSES PAGE CONTENT
=========================================== -->

<main class="houses-page">

    <nav
    id="breadcrumb"
    class="site-breadcrumb"
    aria-label="Breadcrumb"
></nav>

    <div class="houses-layout">

        <!-- ==========================================
             FILTER SIDEBAR
        =========================================== -->

        <aside class="houses-sidebar">

            <div class="houses-sidebar-inner">

                <div class="houses-filter-header">
                    <h2>Filter Houses</h2>
                </div>


                <!-- SEARCH -->

                <div class="house-filter-group">

                    <label for="house-search">
                        Search
                    </label>

                    <input
                        type="text"
                        id="house-search"
                        placeholder="Search houses..."
                    >

                </div>


                <!-- HOUSE TYPE -->

                <div class="house-filter-group">

                    <label for="house-type">
                        House Type
                    </label>

                    <select id="house-type">

                        <option value="">
                            All House Types
                        </option>

                        <option value="Single Room">
                            Single Room
                        </option>

                        <option value="Bedsitter">
                            Bedsitter
                        </option>

                        <option value="1 Bedroom">
                            1 Bedroom
                        </option>

                        <option value="2 Bedroom">
                            2 Bedroom
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- AREA -->

                <div class="house-filter-group">

                    <label for="house-area">
                        Area
                    </label>

                    <input
                        type="text"
                        id="house-area"
                        placeholder="e.g. Kangaru"
                    >

                </div>


                <!-- RENT -->

                <div class="house-filter-group">

                    <label>
                        Rent
                    </label>

                    <div class="rent-inputs">

                        <input
                            type="number"
                            id="min-rent"
                            placeholder="Min"
                            min="0"
                        >

                        <input
                            type="number"
                            id="max-rent"
                            placeholder="Max"
                            min="0"
                        >

                    </div>

                </div>


                <!-- SORT -->

                <div class="house-filter-group">

                    <label for="house-sort">
                        Sort By
                    </label>

                    <select id="house-sort">

                        <option value="latest">
                            Latest
                        </option>

                        <option value="rentLow">
                            Rent: Low to High
                        </option>

                        <option value="rentHigh">
                            Rent: High to Low
                        </option>

                        <option value="oldest">
                            Oldest
                        </option>

                    </select>

                </div>


                <!-- ACTIONS -->

                <div class="house-filter-actions">

                    <button
                        type="button"
                        id="search-houses-button"
                    >
                        Search
                    </button>

                    <button
                        type="button"
                        id="reset-houses-button"
                    >
                        Reset
                    </button>

                </div>

            </div>

        </aside>


        <!-- ==========================================
             HOUSES CONTENT
        =========================================== -->

        <section class="houses-content">

            <div class="houses-results-header">

                <p id="houses-message"></p>

            </div>

            <section
                id="houses-container"
            ></section>

        </section>

    </div>

</main>

<!-- ==========================================
     HOUSES
=========================================== -->

<section id="houses-container"></section>

<!-- ==========================================
     HOUSE DETAILS MODAL
=========================================== -->

    id="house-modal"
    hidden
>

    <div>

        <button
    type="button"
    id="close-house-modal"
    aria-label="Close house details"
>
    <span class="material-symbols-outlined">
        close
    </span>
</button>

        <div id="house-modal-content"></div>

    </div>

</div>
