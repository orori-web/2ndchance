<!-- ==========================================
     REUSABLE PRODUCT MODAL
========================================== -->

<div
    id="product-modal"
    class="product-modal"
    hidden
>

    <div class="product-modal-overlay">

        <div
            class="product-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="product-modal-title"
        >

            <!-- Close button -->

            <button
                id="close-product-modal"
                class="product-modal-close"
                type="button"
                aria-label="Close product details"
            >

                <span class="material-symbols-outlined">
                    close
                </span>

            </button>


            <!-- Product details -->

            <div id="product-modal-body">
                <!-- Product details rendered by JavaScript -->
            </div>

        </div>

    </div>

</div>
