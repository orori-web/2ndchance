<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

     <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    >


    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

    <link
    rel="stylesheet"
    href="./css/variables.css"
>

    <link
    rel="stylesheet"
    href="./css/header.css"
>

<link
    rel="stylesheet"
    href="./css/home.css"

>

<link rel="stylesheet" href="./css/sell.css">


<link
    rel="stylesheet"
    href="./css/header-mobile.css"
>

<link rel="stylesheet" href="./css/bottom-nav.css">

    <title>Sell | Second Chance Store</title>
</head>

<body>

   <div id="site-header"></div>


    <main>

        <nav
    id="breadcrumb"
    class="site-breadcrumb"
    aria-label="Breadcrumb"
></nav>

        <form id="sell-form">

            <!-- Product name -->

            <div>

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="100"
                    required
                >

            </div>


            <!-- Description -->

            <div>

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    maxlength="2000"
                    required
                ></textarea>

            </div>


            <!-- Brand -->

            <div>

                <label for="brand">
                    Brand
                </label>

                <input
                    type="text"
                    id="brand"
                    name="brand"
                    maxlength="50"
                >

            </div>


            <!-- Category -->

            <div>

                <label for="category">
                    Category
                </label>

                <select
                    id="category"
                    name="category"
                    required
                >

                    <option value="">
                        Select category
                    </option>

                </select>

            </div>


            <!-- Price -->

            <div>

                <label for="price">
                    Price (KSh)
                </label>

                <input
                    type="number"
                    id="price"
                    name="price"
                    min="0"
                    required
                >

            </div>


            <!-- Condition -->

            <div>

                <label for="condition">
                    Condition
                </label>

                <select
                    id="condition"
                    name="condition"
                    required
                >

                    <option value="">
                        Select condition
                    </option>

                    <option value="New">
                        New
                    </option>

                    <option value="Like New">
                        Like New
                    </option>

                    <option value="Good">
                        Good
                    </option>

                    <option value="Fair">
                        Fair
                    </option>

                    <option value="Needs Repair">
                        Needs Repair
                    </option>

                </select>

            </div>


            <!-- Seller phone -->

            <div>

                <label for="sellerPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="sellerPhone"
                    name="sellerPhone"
                    placeholder="07XXXXXXXX"
                    required
                >

            </div>


            <!-- Negotiable -->

            <div>

                <label>

                    <input
                        type="checkbox"
                        id="isNegotiable"
                        name="isNegotiable"
                    >

                    Price is negotiable

                </label>

            </div>


            <!-- Images -->

            <div>

                <label for="images">
                    Product Images
                </label>

                <input
                    type="file"
                    id="images"
                    name="images"
                    accept="image/*"
                    multiple
                >

                <p>
                    Maximum 2 images. Maximum 5MB each.
                </p>

            </div>


            <!-- Status -->

            <p
                id="sell-message"
                hidden
            ></p>


            <!-- Submit -->

            <button
                type="submit"
                id="sell-submit-button"
            >
                Post Product
            </button>

        </form>

    </main>


    <div id="site-footer"></div>


    <script
    type="module"
    src="js/header.js"
></script>

<script type="module" src="./js/footer.js"></script>

    <script
        type="module"
        src="./js/sell.js"
    ></script>

</body>

</html>
